{% extends 'base.html' %}

{% block title %}Log {{ series.title }} — Pilotboxd{% endblock %}

{% block content %}
  <a href="{% url 'series_detail' series.pk %}" class="back-link">← {{ series.title }}</a>

  <div class="section-label">log to diary</div>
  <h1>{{ series.title }}</h1>

  <div style="max-width: 460px; margin-top: 32px;">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Season watched</label>
        <select name="season">
          {% for s in season_range %}
            <option value="{{ s }}">Season {{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea name="notes" placeholder="Any thoughts?"></textarea>
      </div>
      <button type="submit" class="btn">Add to diary</button>
    </form>
  </div>
{% endblock %}
